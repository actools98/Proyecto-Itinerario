<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guatemala 2027: ruta, mapa, hoteles y presupuesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header><div class="wrap">
<h1>Guatemala, 4 al 15 de enero de 2027</h1>
<p>Doce días desde Cali: Antigua, Acatenango, lago Atitlán, Semuc Champey, Flores y Tikal. Elige hotel por ciudad y el presupuesto se recalcula.</p>
<div class="fx">
<label>Moneda <select id="cur"><option>COP</option><option>USD</option><option>GTQ</option></select></label>
<label>COP por USD <input id="rCOP" type="number" step="1"></label>
<label>GTQ por USD <input id="rGTQ" type="number" step="0.01"></label>
</div></div></header>
<nav><div class="wrap" role="tablist" id="tabs"></div></nav>
<main><div class="wrap">
<section id="s-ruta"></section>
<section id="s-mapa" hidden></section>
<section id="s-hoteles" hidden></section>
<section id="s-costos" hidden></section>
<section id="s-reservas" hidden></section>
<section id="s-seguridad" hidden></section>
</div></main>
<footer><div class="wrap" id="foot"></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
